<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Charmify — Redirecting…</title>
  <style>
    /* ── Reset & base ─────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%}

    body{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100dvh;
      background:#0f172a;
      color:#e2e8f0;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      user-select:none;
      overflow:hidden;
    }

    /* ── Radial ambient glow ──────────────────────────── */
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:radial-gradient(ellipse 60% 40% at 50% 50%,
        rgba(99,102,241,.18) 0%,transparent 70%);
      pointer-events:none;
    }

    /* ── Card wrapper ─────────────────────────────────── */
    .card{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:28px;
      padding:48px 40px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 32px 64px rgba(0,0,0,.45);
      max-width:320px;
      width:90vw;
      animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Logo wrap with pulse rings ───────────────────── */
    .logo-wrap{
      position:relative;
      width:72px;
      height:72px;
    }
    .logo-wrap::before,.logo-wrap::after{
      content:'';
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:2px solid rgba(99,102,241,.55);
      animation:pulse 2s ease-out infinite;
    }
    .logo-wrap::after{
      inset:-22px;
      border-color:rgba(99,102,241,.25);
      animation-delay:.7s;
    }

    .logo-svg{
      width:72px;
      height:72px;
      border-radius:50%;
      background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 28px rgba(99,102,241,.55);
    }

    /* ── Spinner arc ──────────────────────────────────── */
    .spinner{
      width:40px;
      height:40px;
      border:3px solid rgba(99,102,241,.18);
      border-top-color:#6366f1;
      border-radius:50%;
      animation:spin .9s linear infinite;
    }

    /* ── Text labels ──────────────────────────────────── */
    .brand{
      font-size:1.1rem;
      font-weight:700;
      letter-spacing:-.01em;
      color:#f1f5f9;
    }
    .status{
      font-size:.82rem;
      color:#94a3b8;
      letter-spacing:.02em;
      text-align:center;
      line-height:1.6;
      min-height:2.5em;
    }

    /* ── Manual fallback link ─────────────────────────── */
    .manual{
      font-size:.75rem;
      color:#475569;
      text-align:center;
      line-height:1.7;
    }
    .manual a{
      color:#6366f1;
      text-decoration:none;
      border-bottom:1px solid rgba(99,102,241,.4);
      transition:color .2s,border-color .2s;
    }
    .manual a:hover{color:#818cf8;border-color:#818cf8}

    /* ── Keyframes ────────────────────────────────────── */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(18px)}
      to  {opacity:1;transform:translateY(0)}
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{
      0%  {transform:scale(1);  opacity:1}
      80% {transform:scale(1.9);opacity:0}
      100%{transform:scale(1.9);opacity:0}
    }
  </style>
</head>
<body>

<main class="card" role="status" aria-live="polite" aria-label="Charmify redirect in progress">

  <div class="logo-wrap">
    <div class="logo-svg" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="11" stroke="#fff" stroke-width="2.5"
                stroke-dasharray="5 3" stroke-linecap="round"/>
        <circle cx="18" cy="18" r="5.5" fill="#fff" fill-opacity=".9"/>
        <path d="M18 6 Q24 1 30 6" stroke="#fff" stroke-width="2"
              stroke-linecap="round" fill="none"/>
        <path d="M18 30 Q12 35 6 30" stroke="#fff" stroke-width="2"
              stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </div>

  <span class="brand">Charmify</span>
  <div class="spinner" aria-hidden="true"></div>
  <p class="status" id="fl-status">Evaluating your context…</p>
  <p class="manual" id="fl-manual" aria-live="polite"></p>

</main>

<script>
/* ═══════════════════════════════════════════════════════════
   Charmify — Realtime Redirect Engine  v1.0  (Module 1)
   Single-file, zero-dependency, vanilla JS.
   ═══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var $status = document.getElementById('fl-status');
  var $manual = document.getElementById('fl-manual');

  var LS_KEY       = 'focusloop_rules';
  var SETUP_URL    = '/setup';
  var APP_TIMEOUT  = 500; // ms — safety timer for native app launch

  function setStatus(msg) { $status.textContent = msg; }

  function showManualLink(href) {
    $manual.innerHTML =
      'Not redirected automatically?<br>' +
      '<a id="fl-link" href="' + encodeURI(href) + '">' +
      'Click here to open manually</a>';
  }

  /* Replace so NFC tap doesn't pollute back-stack */
  function go(url) { window.location.replace(url); }

  /* Native deep-link + 500 ms fallback */
  function launchApp(deepLink, fallback) {
    setStatus('Opening app\u2026');
    showManualLink(fallback);

    window.location.href = deepLink; // attempt deep-link

    var timer = setTimeout(function () {
      if (!document.hidden) {
        setStatus('App not found \u2014 opening in browser\u2026');
        go(fallback);
      }
    }, APP_TIMEOUT);

    /* If user returns from app, cancel the stale timer */
    document.addEventListener('visibilitychange', function onShow() {
      if (!document.hidden) {
        clearTimeout(timer);
        document.removeEventListener('visibilitychange', onShow);
      }
    });
  }

  /* ── Main engine ───────────────────────────────────── */
  function run() {

    /* Step 1 – Read localStorage */
    var raw;
    try {
      raw = localStorage.getItem(LS_KEY);
    } catch (e) {
      /* Private-browsing or storage blocked */
      setStatus('Storage unavailable. Redirecting to setup\u2026');
      setTimeout(function () { go(SETUP_URL); }, 800);
      return;
    }

    /* Step 2 – Missing data → setup */
    if (!raw) {
      setStatus('No rules found. Let\u2019s set up\u2026');
      go(SETUP_URL);
      return;
    }

    /* Step 3 – Parse JSON */
    var config;
    try {
      config = JSON.parse(raw);
    } catch (e) {
      setStatus('Rule data is corrupted. Redirecting to setup\u2026');
      try { localStorage.removeItem(LS_KEY); } catch (_) {}
      setTimeout(function () { go(SETUP_URL); }, 800);
      return;
    }

    /* Validate structure */
    var rules = (config && Array.isArray(config.rules)) ? config.rules : [];
    if (!rules.length) {
      setStatus('No rules configured. Let\u2019s set up\u2026');
      go(SETUP_URL);
      return;
    }

    var settings        = config.settings || {};
    var defaultFallback = settings.defaultFallbackUrl || SETUP_URL;

    /* Step 4 – Real-time context */
    var now         = new Date();
    var currentHour = now.getHours();  // 0-23
    var currentDay  = now.getDay();    // 0=Sun … 6=Sat

    setStatus('Matching your schedule\u2026');

    /* Step 5 – First-match rule evaluation */
    var matched = null;
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      var daysOk = Array.isArray(r.daysOfWeek) &&
                   r.daysOfWeek.indexOf(currentDay) !== -1;
      var timeOk = typeof r.startHour === 'number' &&
                   typeof r.endHour   === 'number' &&
                   currentHour >= r.startHour &&
                   currentHour <  r.endHour;
      if (daysOk && timeOk) { matched = r; break; }
    }

    /* Step 6 – Execute matched rule */
    if (matched) {
      setStatus('Rule matched: \u201c' + (matched.label || matched.id) + '\u201d');

      var type = (matched.actionType || '').toLowerCase();

      if (type === 'app') {
        if (!matched.targetUri) {
          go(matched.fallbackUrl || defaultFallback);
          return;
        }
        launchApp(matched.targetUri, matched.fallbackUrl || defaultFallback);

      } else if (type === 'image') {
        var viewerUrl = '/viewer?id=' + encodeURIComponent(matched.id || '');
        setStatus('Opening image\u2026');
        showManualLink(viewerUrl);
        go(viewerUrl);

      } else {
        /* 'web' or any unrecognised type */
        var dest = matched.targetUri || defaultFallback;
        setStatus('Redirecting\u2026');
        showManualLink(dest);
        go(dest);
      }

    } else {
      /* Step 7 – No rule matched */
      setStatus('No active rule right now.\nRedirecting to default\u2026');
      showManualLink(defaultFallback);
      setTimeout(function () { go(defaultFallback); }, 600);
    }
  }

  /* Boot after DOM is ready (usually already is) */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }

}());
</script>

</body>
</html>
